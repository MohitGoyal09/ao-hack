services:
  litellm:
    build:
      context: ./apps/api/litellm
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      LITELLM_FAST_MODEL: ${LITELLM_FAST_MODEL:-gemini/gemini-2.5-flash}
      LITELLM_STRONG_MODEL: ${LITELLM_STRONG_MODEL:-gemini/gemini-2.5-pro}
    ports:
      - "4000:4000"

  api:
    build:
      context: ./apps/api
    environment: &api_env
      DATABASE_URL: ${DATABASE_URL:-}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_FAST_ALIAS: ${LITELLM_FAST_ALIAS:-covenant-fast}
      LITELLM_STRONG_ALIAS: ${LITELLM_STRONG_ALIAS:-covenant-strong}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-covenant-private}
      NEATLOGS_ENABLED: ${NEATLOGS_ENABLED:-false}
      NEATLOGS_API_KEY: ${NEATLOGS_API_KEY:-}
      NEATLOGS_ENDPOINT: ${NEATLOGS_ENDPOINT:-https://ingest.neatlogs.com}
      NEATLOGS_WORKFLOW_NAME: ${NEATLOGS_WORKFLOW_NAME:-covenant-certificate}
      PORT: 8123
    volumes:
      - ./data/raw:/app/data/raw:ro
    ports:
      - "8123:8123"
    depends_on:
      - litellm
  worker:
    build:
      context: ./apps/api
    command: uv run python -m src.platform.worker
    environment: *api_env
    volumes:
      - ./data/raw:/app/data/raw:ro
  web:
    build:
      context: ./apps/web
    environment:
      AGENT_URL: http://api:8123
      CPK_INTELLIGENCE_API_KEY: ${CPK_INTELLIGENCE_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
