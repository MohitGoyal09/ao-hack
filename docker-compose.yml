services:
  litellm:
    build:
      context: ./infra/litellm
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LITELLM_FAST_MODEL: ${LITELLM_FAST_MODEL:-openai/gpt-4.1-mini}
      LITELLM_STRONG_MODEL: ${LITELLM_STRONG_MODEL:-anthropic/claude-sonnet-4-6}
    ports:
      - "4000:4000"

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_FAST_ALIAS: ${LITELLM_FAST_ALIAS:-covenant-fast}
      LITELLM_STRONG_ALIAS: ${LITELLM_STRONG_ALIAS:-covenant-strong}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-covenant-private}
      NEATLOGS_ENABLED: ${NEATLOGS_ENABLED:-false}
      NEATLOGS_WORKFLOW_NAME: ${NEATLOGS_WORKFLOW_NAME:-covenant-certificate}
      PORT: 8123
    ports:
      - "8123:8123"
    depends_on:
      - litellm
  web:
    build:
      context: ./apps/web
    environment:
      AGENT_URL: http://api:8123
      CPK_INTELLIGENCE_API_KEY: ${CPK_INTELLIGENCE_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
