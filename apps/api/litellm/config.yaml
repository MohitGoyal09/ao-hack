model_list:
  - model_name: covenant-fast
    litellm_params:
      model: os.environ/LITELLM_FAST_MODEL
      api_key: os.environ/GEMINI_API_KEY
  - model_name: covenant-strong
    litellm_params:
      model: os.environ/LITELLM_STRONG_MODEL
      api_key: os.environ/GEMINI_API_KEY
  # Optional NVIDIA NIM route (LiteLLM provider prefix nvidia_nim/). Both aliases
  # point at nemotron-3-super-120b-a12b: the only fast, reliable tool caller measured
  # on the free tier (agent-docs/build-e-model.md). Needs NVIDIA_NIM_API_KEY in the
  # litellm container; select with LITELLM_*_ALIAS=nvidia-strong / nvidia-fast.
  - model_name: nvidia-strong
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_NIM_API_KEY
  - model_name: nvidia-fast
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      api_key: os.environ/NVIDIA_NIM_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  fallbacks:
    - covenant-fast:
        - covenant-strong
  num_retries: 2
  timeout: 90

litellm_settings:
  request_timeout: 90
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
